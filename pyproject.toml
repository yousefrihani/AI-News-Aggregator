[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-news-aggregator"
version = "0.2.0"
description = "Async-first AI news aggregation library and CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # TODO: remove requests after the async migration in Wave 2.
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.6",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["Articles"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["Articles", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"Articles/*.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# ``strict = true`` leaks globally in mypy 2.x, so the strict flags are
# listed explicitly to keep legacy modules pragmatic.
module = ["Articles.Models", "Articles.errors"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["Articles.NewsApi", "Articles.Vars"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["requests.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["Articles"]
branch = true
