# Example LLM provider and route configuration.
#
# Copy to config/llm_routes.yaml (or point AI_NEWS_LLM_ROUTES_FILE at it) and
# set the referenced environment variables. Never put API keys in this file.
version: 1

providers:
  groq:
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    models:
      fast:
        id: llama-3.3-70b-versatile
        context_window: 128000
        supports: [json_object, json_schema]
      cheap:
        id: llama-3.1-8b-instant
        context_window: 128000
        supports: [json_object]

  openrouter:
    kind: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    headers:
      HTTP-Referer: https://github.com/yousefrihani/AI-News-Aggregator
      X-Title: AI-News-Aggregator
    models:
      balanced:
        id: meta-llama/llama-3.3-70b-instruct
        context_window: 128000
        supports: [json_object, json_schema]
      reasoning:
        id: deepseek/deepseek-r1
        context_window: 64000
        supports: [json_object]

routes:
  summarize:
    candidates: [groq/fast, openrouter/balanced]
    temperature: 0.2
    max_tokens: 400
    timeout_s: 30
    retries: 2
    max_input_tokens: 6000

  classify:
    candidates: [groq/cheap, groq/fast]
    temperature: 0.0
    max_tokens: 120
    response_format: json_object

  extract_graph:
    candidates: [openrouter/balanced, groq/fast]
    temperature: 0.0
    max_tokens: 1200
    response_format: json_schema
    schema_ref: graph_extraction.v1
    retries: 2

  graph_rag:
    candidates: [groq/fast, openrouter/balanced]
    temperature: 0.1
    max_tokens: 800
    timeout_s: 45
    retries: 2
    max_input_tokens: 8000

  # Routes consumed by the custom agent workflow. The runtime seam ships in
  # v0.7; the workflow itself is supplied separately.
  agent.planner:
    candidates: [openrouter/reasoning, openrouter/balanced, groq/fast]
    max_tokens: 800
  agent.answer:
    candidates: [groq/fast, openrouter/balanced]
    max_tokens: 800
  agent.critic:
    candidates: [openrouter/balanced, groq/fast]
    temperature: 0.0
